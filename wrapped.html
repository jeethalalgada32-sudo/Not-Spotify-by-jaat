<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Wrapped 🎧</title>
<script src="https://js.puter.com/v2/"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #0a0a0f;
  color: #fff;
  font-family: 'Segoe UI', sans-serif;
  min-height: 100vh;
  padding: 20px;
}

.back-btn {
  display: inline-flex; align-items: center; gap: 8px;
  color: #666; font-size: 13px;
  margin-bottom: 24px; cursor: pointer;
  background: none; border: none; padding: 0;
}
.back-btn:hover { color: #fff; }

.wrapped-title {
  text-align: center;
  margin-bottom: 32px;
}
.wrapped-title h1 {
  font-size: 28px; font-weight: 800;
  background: linear-gradient(135deg, #00ff88, #00ccff);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.wrapped-title p { color: #555; font-size: 13px; margin-top: 6px; }

.stats-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-bottom: 32px;
}

.stat-card {
  background: #111;
  border: 1px solid #1e1e1e;
  border-radius: 16px;
  padding: 20px;
  position: relative;
  overflow: hidden;
}
.stat-card.big { grid-column: span 2; }
.stat-card .label {
  font-size: 11px; color: #555;
  text-transform: uppercase; letter-spacing: 1px;
  margin-bottom: 8px;
}
.stat-card .value {
  font-size: 22px; font-weight: 700; color: #fff;
  line-height: 1.2;
}
.stat-card .sub { font-size: 12px; color: #666; margin-top: 4px; }
.stat-card .emoji {
  position: absolute; right: 16px; top: 16px;
  font-size: 28px; opacity: 0.3;
}
.stat-card.highlight { border-color: #00ff8833; background: #0a1a12; }
.stat-card.highlight .value { color: #00ff88; }

.personality-card {
  background: linear-gradient(135deg, #0a0a1f, #1a0a2e);
  border: 1px solid #2a1a4a;
  border-radius: 16px;
  padding: 24px;
  text-align: center;
  margin-bottom: 32px;
}
.personality-card .tag {
  display: inline-block;
  background: #2a1a4a; color: #aa88ff;
  font-size: 11px; padding: 4px 12px;
  border-radius: 20px; margin-bottom: 12px;
  text-transform: uppercase; letter-spacing: 1px;
}
.personality-card h2 { font-size: 22px; margin-bottom: 8px; }
.personality-card p { font-size: 13px; color: #888; line-height: 1.6; }

.section-title {
  font-size: 13px; color: #555;
  text-transform: uppercase; letter-spacing: 1px;
  margin-bottom: 14px;
}

.songs-list {
  display: flex; flex-direction: column; gap: 8px;
  margin-bottom: 32px;
}

.song-row {
  display: flex; align-items: center; gap: 12px;
  background: #111; border: 1px solid #1e1e1e;
  border-radius: 12px; padding: 10px 14px;
}
.song-row .rank {
  font-size: 16px; font-weight: 800;
  color: #333; min-width: 24px;
}
.song-row .rank.top { color: #00ff88; }
.song-row .song-info { flex: 1; }
.song-row .song-title { font-size: 13px; color: #fff; }
.song-row .song-plays { font-size: 11px; color: #555; margin-top: 2px; }
.song-row .bar-wrap {
  width: 60px; height: 4px;
  background: #1e1e1e; border-radius: 2px;
}
.song-row .bar {
  height: 100%; background: #00ff88;
  border-radius: 2px;
}

.images-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-bottom: 32px;
}

.ai-img-card {
  border-radius: 14px; overflow: hidden;
  border: 1px solid #1e1e1e; position: relative;
  aspect-ratio: 1; background: #111;
  display: flex; align-items: center; justify-content: center;
}
.ai-img-card.featured {
  grid-column: span 2;
  aspect-ratio: 16/9;
}
.ai-img-card img {
  width: 100%; height: 100%;
  object-fit: cover; display: block;
}
.ai-img-card .img-label {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 20px 12px 12px;
  background: linear-gradient(transparent, rgba(0,0,0,0.8));
  font-size: 11px; color: #ccc;
}
.placeholder {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  height: 100%; color: #333; font-size: 12px; gap: 8px;
}

.spinner {
  width: 24px; height: 24px;
  border: 2px solid #1e1e1e;
  border-top-color: #00ff88;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.share-btn {
  width: 100%; padding: 14px;
  border-radius: 25px; border: none;
  background: linear-gradient(135deg, #00ff88, #00ccff);
  color: #000; font-weight: 800; font-size: 15px;
  cursor: pointer; margin-bottom: 16px;
}
.back-home {
  width: 100%; padding: 12px;
  border-radius: 25px;
  border: 1px solid #333; background: none;
  color: #888; font-size: 14px; cursor: pointer;
}
.back-home:hover { color: #fff; border-color: #555; }

.not-enough {
  text-align: center; padding: 60px 20px; color: #555;
}
.not-enough h2 { font-size: 20px; margin-bottom: 8px; color: #fff; }
.not-enough p { font-size: 13px; line-height: 1.6; }
</style>
</head>
<body>

<div id="app"></div>

<script>
const history = JSON.parse(localStorage.getItem("history")) || [];
const app = document.getElementById("app");

if (history.length < 3) {
  app.innerHTML = `
    <div class="not-enough">
      <h2>🎧 Not enough data yet!</h2>
      <p>Listen to at least 3 songs first,<br>then come back for your Wrapped!</p>
      <br>
      <button class="back-home" onclick="location.href='index.html'">⬅ Back to StreamFlow</button>
    </div>`;
} else {
  generateWrapped();
}

function generateWrapped() {
  const songCount = {};
  const artistCount = {};
  let maxRepeat = 0, repeatSong = "";
  let night = 0, day = 0;

  history.forEach(item => {
    songCount[item.title] = (songCount[item.title] || 0) + 1;
    artistCount[item.artist] = (artistCount[item.artist] || 0) + 1;
    if (songCount[item.title] > maxRepeat) {
      maxRepeat = songCount[item.title];
      repeatSong = item.title;
    }
    const hour = new Date(item.time).getHours();
    if (hour >= 22 || hour < 5) night++; else day++;
  });

  const topSongs = Object.entries(songCount).sort((a,b) => b[1]-a[1]).slice(0,5);
  const topArtists = Object.entries(artistCount).sort((a,b) => b[1]-a[1]).slice(0,3);
  const topSong = topSongs[0][0];
  const topArtist = topArtists[0][0];
  const maxPlays = topSongs[0][1];

  let personality, personalityDesc, personalityEmoji;
  if (maxRepeat >= 4) {
    personality = "Loop Lover"; personalityEmoji = "🔁";
    personalityDesc = "You find a song you love and hit repeat until it's part of your soul.";
  } else if (night > day) {
    personality = "Night Owl"; personalityEmoji = "🌙";
    personalityDesc = "Your best listening happens after midnight. Music sounds different when the world is asleep.";
  } else if (Object.keys(songCount).length > history.length * 0.7) {
    personality = "Explorer"; personalityEmoji = "🔥";
    personalityDesc = "You never stop discovering. Every song is a new adventure for you.";
  } else {
    personality = "Vibe Curator"; personalityEmoji = "🎧";
    personalityDesc = "You know exactly what you want and you stick to what hits right.";
  }

  app.innerHTML = `
    <button class="back-btn" onclick="location.href='index.html'">← Back</button>

    <div class="wrapped-title">
      <h1>Your Wrapped 🎧</h1>
      <p>${history.length} songs played • Your year in music</p>
    </div>

    <div class="stats-grid">
      <div class="stat-card big highlight">
        <div class="label">🔥 Top Song</div>
        <div class="value">${topSong}</div>
        <div class="sub">Played ${maxPlays}x</div>
        <div class="emoji">🎵</div>
      </div>
      <div class="stat-card highlight">
        <div class="label">🎤 Top Artist</div>
        <div class="value">${topArtist}</div>
        <div class="sub">${artistCount[topArtist]} plays</div>
        <div class="emoji">⭐</div>
      </div>
      <div class="stat-card">
        <div class="label">📊 Total Plays</div>
        <div class="value">${history.length}</div>
        <div class="sub">songs listened</div>
        <div class="emoji">📻</div>
      </div>
      <div class="stat-card">
        <div class="label">${night > day ? "🌙 Night Listener" : "☀️ Day Listener"}</div>
        <div class="value">${night > day ? night : day}</div>
        <div class="sub">${night > day ? "late night plays" : "daytime plays"}</div>
        <div class="emoji">${night > day ? "🌙" : "☀️"}</div>
      </div>
      <div class="stat-card">
        <div class="label">🔁 Most Replayed</div>
        <div class="value" style="font-size:15px">${repeatSong}</div>
        <div class="sub">${maxRepeat}x replayed</div>
        <div class="emoji">🔂</div>
      </div>
    </div>

    <div class="personality-card">
      <div class="tag">Your Music Personality</div>
      <h2>${personalityEmoji} ${personality}</h2>
      <p>${personalityDesc}</p>
    </div>

    <p class="section-title">Top 5 Songs</p>
    <div class="songs-list">
      ${topSongs.map(([title, plays], i) => `
        <div class="song-row">
          <span class="rank ${i === 0 ? 'top' : ''}">${i + 1}</span>
          <div class="song-info">
            <div class="song-title">${title}</div>
            <div class="song-plays">${plays} play${plays > 1 ? 's' : ''}</div>
          </div>
          <div class="bar-wrap">
            <div class="bar" style="width:${Math.round((plays/maxPlays)*100)}%"></div>
          </div>
        </div>
      `).join("")}
    </div>

    <p class="section-title">🎨 AI Generated Vibes</p>
    <div class="images-grid" id="imagesGrid">
      <div class="ai-img-card featured" id="img0">
        <div class="placeholder"><div class="spinner"></div><span>Generating...</span></div>
      </div>
      <div class="ai-img-card" id="img1">
        <div class="placeholder"><div class="spinner"></div><span>Generating...</span></div>
      </div>
      <div class="ai-img-card" id="img2">
        <div class="placeholder"><div class="spinner"></div><span>Generating...</span></div>
      </div>
      <div class="ai-img-card" id="img3">
        <div class="placeholder"><div class="spinner"></div><span>Generating...</span></div>
      </div>
      <div class="ai-img-card" id="img4">
        <div class="placeholder"><div class="spinner"></div><span>Generating...</span></div>
      </div>
    </div>

    <button class="share-btn" onclick="shareWrapped()">Share My Wrapped 🎉</button>
    <button class="back-home" onclick="location.href='index.html'">⬅ Back to StreamFlow</button>
  `;

  generateImages(topSong, topArtist, personality);
}

async function generateImages(topSong, topArtist, personality) {
  const prompts = [
    `album cover art for ${topArtist} music vibrant neon colors professional digital art`,
    `${personality} music listener aesthetic moody cinematic lighting digital art`,
    `music concert crowd neon lights energy cinematic photography`,
    `abstract sound visualization colorful waves futuristic art`,
    `vinyl record music studio warm colors professional photo`
  ];

  for (let i = 0; i < prompts.length; i++) {
    const card = document.getElementById(`img${i}`);
    card.innerHTML = `<div class="placeholder"><div class="spinner"></div><span>Generating...</span></div>`;

    try {
      const imgElement = await puter.ai.txt2img(prompts[i]);

      card.innerHTML = "";
      imgElement.style.cssText = "width:100%;height:100%;object-fit:cover;display:block;";
      card.appendChild(imgElement);

      const label = document.createElement("div");
      label.className = "img-label";
      label.innerText = prompts[i].split(' ').slice(0, 4).join(' ');
      card.appendChild(label);

    } catch(e) {
      console.error("Image error:", e);
      card.innerHTML = `<div class="placeholder"><span style="color:#444">Could not generate</span></div>`;
    }
  }
}

function shareWrapped() {
  if (navigator.share) {
    navigator.share({
      title: 'My StreamFlow Wrapped 🎧',
      text: 'Check out my music Wrapped on StreamFlow!',
      url: window.location.href
    });
  } else {
    navigator.clipboard.writeText(window.location.href);
    alert('Link copied!');
  }
}
</script>
</body>
</html>
