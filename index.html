<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StreamFlow ⚡</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  display: flex; flex-direction: column;
  height: 100dvh; background: #0a0a0f;
  color: #fff; font-family: 'Segoe UI', sans-serif;
  overflow: hidden;
}

header {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 12px; background: #111;
  border-bottom: 1px solid #1e1e1e; flex-shrink: 0;
}
header h1 { font-size: 16px; color: #00ff88; white-space: nowrap; }
header input {
  flex: 1; padding: 8px 14px; border-radius: 25px;
  border: 1px solid #333; background: #1a1a1a;
  color: #fff; font-size: 13px; outline: none; min-width: 0;
}
header input:focus { border-color: #00ff88; }
header .search-btn {
  padding: 8px 14px; border-radius: 25px; border: none;
  background: #00ff88; color: #000; font-weight: bold;
  cursor: pointer; font-size: 13px; white-space: nowrap;
}
header .wrapped-btn {
  padding: 8px 12px; border-radius: 25px;
  border: 1px solid #333; background: none;
  color: #aaa; cursor: pointer; font-size: 12px;
  white-space: nowrap;
}
header .wrapped-btn:hover { color: #fff; border-color: #555; }

.main { display: flex; flex: 1; overflow: hidden; min-height: 0; }

.search-panel { flex: 1; overflow-y: auto; padding: 16px; min-width: 0; }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 12px;
}

.card {
  background: #111; border-radius: 12px;
  border: 1px solid #1e1e1e; cursor: pointer;
  overflow: hidden; transition: all 0.2s;
}
.card:hover { border-color: #00ff88; transform: translateY(-2px); }
.card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; }
.card p { font-size: 12px; color: #ccc; padding: 8px; line-height: 1.4; }

.ai-panel {
  width: 340px; min-width: 340px;
  border-left: 1px solid #1e1e1e;
  display: flex; flex-direction: column;
  background: #0d0d14; min-height: 0;
}

.ai-header {
  padding: 13px 16px; background: #111;
  border-bottom: 1px solid #1e1e1e;
  display: flex; align-items: center; gap: 8px;
  flex-shrink: 0;
}
.ai-header .dot { width: 8px; height: 8px; border-radius: 50%; background: #00ff88; }
.ai-header .name { font-size: 14px; font-weight: bold; color: #00ff88; }
.ai-header small { color: #444; font-size: 11px; margin-left: auto; }

.ai-messages {
  flex: 1; overflow-y: auto; padding: 14px;
  display: flex; flex-direction: column; gap: 10px;
  min-height: 0;
}

.ai-msg {
  padding: 10px 13px; border-radius: 14px;
  font-size: 13px; line-height: 1.6; max-width: 94%;
}
.ai-msg.bot {
  background: #13131f; border: 1px solid #1e1e2e;
  align-self: flex-start; border-bottom-left-radius: 4px;
}
.ai-msg.user {
  background: #00ff88; color: #000;
  align-self: flex-end; border-bottom-right-radius: 4px;
}

.song-chip {
  display: flex; align-items: center; gap: 8px;
  background: #1a1a2e; border: 1px solid #2a2a4a;
  border-radius: 10px; padding: 8px 11px;
  margin-top: 6px; cursor: pointer; font-size: 12px;
  transition: all 0.2s; color: #ccc;
}
.song-chip:hover { border-color: #00ff88; color: #00ff88; }
.song-chip .pi { font-size: 14px; color: #00ff88; }
.mood-text { color: #888; font-size: 12px; margin-bottom: 4px; }

.ai-input {
  display: flex; gap: 8px; padding: 12px;
  background: #111; border-top: 1px solid #1e1e1e;
  flex-shrink: 0;
}
.ai-input input {
  flex: 1; padding: 9px 14px; border-radius: 25px;
  border: 1px solid #333; background: #1a1a1a;
  color: #fff; font-size: 13px; outline: none;
}
.ai-input input:focus { border-color: #00ff88; }
.ai-input button {
  padding: 9px 16px; border-radius: 25px; border: none;
  background: #00ff88; color: #000; font-weight: bold;
  cursor: pointer; font-size: 15px;
}
.ai-input button:disabled { background: #222; color: #555; cursor: not-allowed; }

/* NOW PLAYING */
<!-- Now Playing Bar -->
<div class="now-playing" id="nowPlaying" onclick="openModal()">
  <span class="np-icon">♫</span>
  <div class="np-info">
    <div class="np-title" id="npTitle">—</div>
    <div class="np-sub">Now Playing • tap to expand</div>
  </div>
  <div class="np-controls" onclick="event.stopPropagation()">
    <button onclick="playPrev()" title="Previous">⏮</button>
    <button id="playPauseBtn" onclick="togglePlayPause()" title="Play/Pause">⏸</button>
    <button onclick="playNext()" title="Next">⏭</button>
  </div>
  <button class="np-queue-btn" onclick="event.stopPropagation(); toggleQueue()" title="Up Next">☰</button>
  <button class="np-close" onclick="event.stopPropagation(); stopPlayer()">✕</button>
</div>

<!-- Video Modal -->
<div class="video-modal" id="videoModal">
  <div class="vm-header">
    <button class="vm-down" onclick="closeModal()">⌄</button>
    <div class="vm-toggle">
      <button id="songBtn" class="active" onclick="setMode('song')">Song</button>
      <button id="videoBtn" onclick="setMode('video')">Video</button>
    </div>
    <button style="background:none;border:none;color:#fff;font-size:22px;cursor:pointer;">⋯</button>
  </div>

  <div class="vm-media" id="vmMedia">

  <div class="vm-info">
    <h2 id="vmTitle">—</h2>

  <div class="vm-progress">

    <div class="vm-times">

    <button class="vm-ctrl-side" onclick="playPrev()">⏮</button>

    <button class="vm-ctrl-side" onclick="playNext()">⏭</button>
  </div>

  <div class="vm-tabs">
    <button class="active" onclick="vmTab(this,'upnext')">Up Next</button>
    <button onclick="vmTab(this,'related')">Related</button>
  </div>

  </div>
</div>

/* QUEUE PANEL */

  display: none;
  position: fixed; bottom: 55px; right: 0;
  width: 300px; max-height: 400px;
  background: #111; border: 1px solid #1e1e1e;
  border-radius: 16px 0 0 0;
  z-index: 100; flex-direction: column;
  overflow: hidden; box-shadow: -4px -4px 20px rgba(0,0,0,0.5);
}
.queue-panel.active { display: flex; }
.queue-header {
  display: flex; justify-content: space-between;
  align-items: center; padding: 14px 16px;
  background: #161616; border-bottom: 1px solid #1e1e1e;
  font-size: 13px; font-weight: bold; color: #fff;
  flex-shrink: 0;
}
.queue-header button {
  background: none; border: none;
  color: #666; font-size: 16px; cursor: pointer;
}
.queue-header button:hover { color: #fff; }
.queue-list { overflow-y: auto; padding: 8px; }
.queue-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: 10px;
  cursor: pointer; transition: all 0.2s;
  font-size: 12px; color: #ccc;
}
.queue-item:hover { background: #1a1a1a; color: #fff; }
.queue-item.active { color: #00ff88; background: #0a1a12; }
.queue-item .qi-num { color: #444; min-width: 20px; font-size: 11px; }
.queue-item .qi-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

@media (max-width: 768px) {
  body { height: 100dvh; }
  .main { flex-direction: column; }
  .search-panel { flex: 1; overflow-y: auto; order: 1; min-height: 0; }
  .ai-panel {
    width: 100%; min-width: unset;
    height: 44vh; flex-shrink: 0;
    border-left: none; border-top: 1px solid #1e1e1e;
    order: 2;
  }
  .grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
  header h1 { font-size: 14px; }
  header input { font-size: 12px; padding: 7px 12px; }
  header .search-btn { font-size: 12px; padding: 7px 12px; }
  header .wrapped-btn { font-size: 11px; padding: 7px 10px; }
  .queue-panel { width: 100%; border-radius: 16px 16px 0 0; }
  .np-controls button, .np-queue-btn, .np-close { font-size: 16px; padding: 4px 6px; }
}

header, .main, .now-playing, .queue-panel { position: relative; z-index: 1; }
.queue-panel { position: fixed; z-index: 100; }

<script>
let chatHistory = JSON.parse(localStorage.getItem("chatHistory")) || [];

function cleanText(text) {
  return text.replace(/\*\*/g, "").replace(/\*/g, "").replace(/\[(\d+)\]/g, "").trim();
}

function addAiMsg(text, type) {
  const container = document.getElementById("aiMessages");
  const div = document.createElement("div");
  div.className = "ai-msg " + type;
  if (type === "bot") {
    const lines = text.split("\n");
    let html = "";
    lines.forEach(line => {
      const trimmed = cleanText(line);
      if (!trimmed) return;
      if (line.trim().startsWith("🎵")) {
        const songName = trimmed.replace("🎵", "").trim();
        html += `<div class="song-chip" onclick="playSongByName('${songName.replace(/'/g, "\\'")}')">
          <span class="pi">▶</span><span>${songName}</span>
        </div>`;
      } else {
        html += `<p class="mood-text">${trimmed}</p>`;
      }
    });
    div.innerHTML = html;
  } else {
    div.innerText = text;
  }
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

async function sendMsg() {
  const input = document.getElementById("aiInput");
  const btn = document.getElementById("sendBtn");
  const text = input.value.trim();
  if (!text) return;
  addAiMsg(text, "user");
  input.value = "";
  btn.disabled = true;
  chatHistory.push({ role: "user", content: text });
  const container = document.getElementById("aiMessages");
  const typing = document.createElement("div");
  typing.className = "ai-msg bot";
  typing.style.color = "#444";
  typing.innerText = "Finding your vibe...";
  container.appendChild(typing);
  container.scrollTop = container.scrollHeight;
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, history: chatHistory.slice(-8) })
    });
    const data = await res.json();
    typing.remove();
    addAiMsg(data.reply, "bot");
    chatHistory.push({ role: "assistant", content: data.reply });
    localStorage.setItem("chatHistory", JSON.stringify(chatHistory.slice(-20)));
  } catch (e) {
    typing.remove();
    addAiMsg("Something went wrong. Try again!", "bot");
  }
  btn.disabled = false;
  input.focus();
}

async function playSongByName(name) {
  try {
    const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(name)}&type=video&maxResults=1&key=${YOUTUBE_API_KEY}`);
    const data = await res.json();
    if (data.items && data.items.length > 0) {
      const item = data.items[0];
      playSong(item.id.videoId, item.snippet.title, item.snippet.channelTitle, null);
    }
  } catch(e) { console.error("Play error:", e); }
}

function togglePlayPause() {
  if (!player) return;
  const state = player.getPlayerState();
  if (state === YT.PlayerState.PLAYING) {
    player.pauseVideo();
    document.getElementById("playPauseBtn").innerText = "▶";
  } else {
    player.playVideo();
    document.getElementById("playPauseBtn").innerText = "⏸";
  }
}

function toggleQueue() {
  const panel = document.getElementById("queuePanel");
  panel.classList.toggle("active");
  if (panel.classList.contains("active")) updateQueueUI();
}

function updateQueueUI() {
  const list = document.getElementById("queueList");
  if (currentQueue.length === 0) {
    list.innerHTML = `<p style="color:#444;font-size:12px;padding:12px">Queue empty — search songs!</p>`;
    return;
  }
  list.innerHTML = currentQueue.map((item, i) => `
    <div class="queue-item ${i === currentQueueIndex ? 'active' : ''}" onclick="jumpToQueue(${i})">
      <span class="qi-num">${i === currentQueueIndex ? '▶' : i+1}</span>
      <span class="qi-title">${item.title}</span>
    </div>
  `).join("");
}

function jumpToQueue(index) {
  currentQueueIndex = index;
  const item = currentQueue[index];
  player.loadVideoById(item.videoId);
  document.getElementById("npTitle").innerText = item.title;
  document.getElementById("nowPlaying").classList.add("active");
  document.getElementById("playPauseBtn").innerText = "⏸";
  history.push({ title: item.title, artist: item.artist, time: Date.now() });
  localStorage.setItem("history", JSON.stringify(history));
  updateQueueUI();
}

function playPrev() {
  if (currentQueue.length === 0) return;
  currentQueueIndex = (currentQueueIndex - 1 + currentQueue.length) % currentQueue.length;
  const item = currentQueue[currentQueueIndex];
  player.loadVideoById(item.videoId);
  document.getElementById("npTitle").innerText = item.title;
  document.getElementById("playPauseBtn").innerText = "⏸";
  history.push({ title: item.title, artist: item.artist, time: Date.now() });
  localStorage.setItem("history", JSON.stringify(history));
  updateQueueUI();
}

function stopPlayer() {
  if (player && player.stopVideo) player.stopVideo();
  document.getElementById("nowPlaying").classList.remove("active");
  document.getElementById("queuePanel").classList.remove("active");
  currentQueue = [];
  currentQueueIndex = -1;
}
</script>

<!-- Particle Animation -->
<script>
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');
let W = canvas.width = window.innerWidth;
let H = canvas.height = window.innerHeight;
let mouse = { x: W/2, y: H/2 };
let time = 0;

window.addEventListener('resize', () => {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
});
window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
window.addEventListener('touchmove', e => { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; });

const particles = [];
const PARTICLE_COUNT = 80;

class Particle {
  constructor() { this.reset(); }
  reset() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.size = Math.random() * 2 + 0.5;
    this.speedX = (Math.random() - 0.5) * 0.5;
    this.speedY = (Math.random() - 0.5) * 0.5;
    this.opacity = Math.random() * 0.5 + 0.1;
    this.color = Math.random() > 0.5 ? '0,255,136' : '0,204,255';
  }
  update() {
    const dx = mouse.x - this.x;
    const dy = mouse.y - this.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < 150) { this.x += dx * 0.01; this.y += dy * 0.01; }
    this.x += this.speedX;
    this.y += this.speedY;
    if (this.x < 0 || this.x > W) this.speedX *= -1;
    if (this.y < 0 || this.y > H) this.speedY *= -1;
  }
  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${this.color},${this.opacity})`;
    ctx.fill();
  }
}

for (let i = 0; i < PARTICLE_COUNT; i++) particles.push(new Particle());

function connectParticles() {
  for (let i = 0; i < particles.length; i++) {
    for (let j = i+1; j < particles.length; j++) {
      const dx = particles[i].x - particles[j].x;
      const dy = particles[i].y - particles[j].y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < 100) {
        ctx.beginPath();
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y);
        ctx.strokeStyle = `rgba(0,255,136,${0.1 * (1 - dist/100)})`;
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }
    }
  }
}

function drawWaves() {
  for (let w = 0; w < 3; w++) {
    ctx.beginPath();
    ctx.moveTo(0, H * 0.5);
    for (let x = 0; x < W; x += 5) {
      const y = H * 0.5 +
        Math.sin(x * 0.008 + time + w * 2) * (30 + w * 15) +
        Math.sin(x * 0.015 + time * 0.7) * 20 +
        (mouse.y - H/2) * 0.05;
      ctx.lineTo(x, y);
    }
    ctx.strokeStyle = [`rgba(0,255,136,0.03)`, `rgba(0,204,255,0.025)`, `rgba(150,100,255,0.02)`][w];
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }
}

function drawMouseGlow() {
  const grad = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 120);
  grad.addColorStop(0, 'rgba(0,255,136,0.06)');
  grad.addColorStop(1, 'rgba(0,255,136,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

function animate() {
  ctx.clearRect(0, 0, W, H);
  time += 0.008;
  drawWaves();
  drawMouseGlow();
  particles.forEach(p => { p.update(); p.draw(); });
  connectParticles();
  requestAnimationFrame(animate);
}

animate();
</script>
