<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StreamFlow AI ⚡</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- SIDEBAR -->
<div id="sidebar" class="sidebar">
    <div class="sidebar-header">SF-AI v2.0</div>

    <a href="#" onclick="closeSidebar()">🏠 Dashboard</a>
    <a href="#" onclick="generateRecap(); closeSidebar()">🔥 My Recap</a>
    <a href="#" onclick="generateWrapped(); closeSidebar()">🎧 My Wrapped</a>

    <div class="ai-status">AI: Online</div>
</div>

<!-- HEADER -->
<header class="glass-header">
    <div class="logo" id="menuBtn">☰ StreamFlow⚡</div>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Describe your vibe...">
        <button onclick="askGemini()">AI</button>
        <button onclick="searchYT()">🔍</button>
    </div>
</header>

<!-- MAIN -->
<main>
    <div id="results" class="cards">
        <div class="welcome-box">
            <h1>Ready to Vibe?</h1>
            <p>Search or use AI to explore music 🎧</p>
            <p style="font-size:12px; opacity:0.6;">Powered by StreamFlow AI ⚡</p>
        </div>
    </div>
</main>

<!-- PLAYER -->
<div id="videoOverlay" class="player-overlay">
    <button id="closeBtn">✖</button>
    <div id="player"></div>
</div>

<script src="script.js"></script>

<script>
// SIDEBAR CONTROL
const sidebar = document.getElementById("sidebar");
const menuBtn = document.getElementById("menuBtn");

menuBtn.onclick = () => sidebar.classList.toggle("show");

function closeSidebar() {
    sidebar.classList.remove("show");
}

document.addEventListener("click", function(e) {
    if (!sidebar.contains(e.target) && !menuBtn.contains(e.target)) {
        sidebar.classList.remove("show");
    }
});
</script>

</body>
</html>
