<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StreamFlow ⚡</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  display: flex; flex-direction: column;
  height: 100dvh; background: #0a0a0f;
  color: #fff; font-family: 'Segoe UI', sans-serif;
  overflow: hidden;
}

header {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 12px; background: #111;
  border-bottom: 1px solid #1e1e1e; flex-shrink: 0;
}
header h1 { font-size: 16px; color: #00ff88; white-space: nowrap; }
header input {
  flex: 1; padding: 8px 14px; border-radius: 25px;
  border: 1px solid #333; background: #1a1a1a;
  color: #fff; font-size: 13px; outline: none; min-width: 0;
}
header input:focus { border-color: #00ff88; }
header .search-btn {
  padding: 8px 14px; border-radius: 25px; border: none;
  background: #00ff88; color: #000; font-weight: bold;
  cursor: pointer; font-size: 13px; white-space: nowrap;
}
header .wrapped-btn {
  padding: 8px 12px; border-radius: 25px;
  border: 1px solid #333; background: none;
  color: #aaa; cursor: pointer; font-size: 12px;
  white-space: nowrap;
}
header .wrapped-btn:hover { color: #fff; border-color: #555; }

.main { display: flex; flex: 1; overflow: hidden; min-height: 0; }
.search-panel { flex: 1; overflow-y: auto; padding: 16px; min-width: 0; }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 12px;
}

.card {
  background: #111; border-radius: 12px;
  border: 1px solid #1e1e1e; cursor: pointer;
  overflow: hidden; transition: all 0.2s;
}
.card:hover { border-color: #00ff88; transform: translateY(-2px); }
.card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; }
.card p { font-size: 12px; color: #ccc; padding: 8px; line-height: 1.4; }

.ai-panel {
  width: 340px; min-width: 340px;
  border-left: 1px solid #1e1e1e;
  display: flex; flex-direction: column;
  background: #0d0d14; min-height: 0;
}
.ai-header {
  padding: 13px 16px; background: #111;
  border-bottom: 1px solid #1e1e1e;
  display: flex; align-items: center; gap: 8px;
  flex-shrink: 0;
}
.ai-header .dot { width: 8px; height: 8px; border-radius: 50%; background: #00ff88; }
.ai-header .name { font-size: 14px; font-weight: bold; color: #00ff88; }
.ai-header small { color: #444; font-size: 11px; margin-left: auto; }

.ai-messages {
  flex: 1; overflow-y: auto; padding: 14px;
  display: flex; flex-direction: column; gap: 10px;
  min-height: 0;
}
.ai-msg {
  padding: 10px 13px; border-radius: 14px;
  font-size: 13px; line-height: 1.6; max-width: 94%;
}
.ai-msg.bot {
  background: #13131f; border: 1px solid #1e1e2e;
  align-self: flex-start; border-bottom-left-radius: 4px;
}
.ai-msg.user {
  background: #00ff88; color: #000;
  align-self: flex-end; border-bottom-right-radius: 4px;
}
.song-chip {
  display: flex; align-items: center; gap: 8px;
  background: #1a1a2e; border: 1px solid #2a2a4a;
  border-radius: 10px; padding: 8px 11px;
  margin-top: 6px; cursor: pointer; font-size: 12px;
  transition: all 0.2s; color: #ccc;
}
.song-chip:hover { border-color: #00ff88; color: #00ff88; }
.song-chip .pi { font-size: 14px; color: #00ff88; }
.mood-text { color: #888; font-size: 12px; margin-bottom: 4px; }

.ai-input {
  display: flex; gap: 8px; padding: 12px;
  background: #111; border-top: 1px solid #1e1e1e;
  flex-shrink: 0;
}
.ai-input input {
  flex: 1; padding: 9px 14px; border-radius: 25px;
  border: 1px solid #333; background: #1a1a1a;
  color: #fff; font-size: 13px; outline: none;
}
.ai-input input:focus { border-color: #00ff88; }
.ai-input button {
  padding: 9px 16px; border-radius: 25px; border: none;
  background: #00ff88; color: #000; font-weight: bold;
  cursor: pointer; font-size: 15px;
}
.ai-input button:disabled { background: #222; color: #555; cursor: not-allowed; }

/* NOW PLAYING BAR */
.now-playing {
  display: none; align-items: center; gap: 8px;
  padding: 10px 16px; background: #111;
  border-top: 1px solid #1e1e1e; flex-shrink: 0;
  cursor: pointer; z-index: 10;
}
.now-playing.active { display: flex; }
.np-icon { color: #00ff88; font-size: 20px; flex-shrink: 0; }
.np-thumb {
  width: 40px; height: 40px; border-radius: 6px;
  object-fit: cover; flex-shrink: 0; display: none;
}
.np-thumb.show { display: block; }
.np-info { flex: 1; min-width: 0; }
.np-title { font-size: 13px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np-sub { font-size: 11px; color: #555; }

.np-controls {
  display: flex; align-items: center; gap: 2px; flex-shrink: 0;
}
.np-controls button, .np-queue-btn, .np-close, .np-expand {
  background: none; border: none; color: #aaa; font-size: 18px;
  cursor: pointer; padding: 4px 8px; border-radius: 8px; transition: all 0.2s;
}
.np-controls button:hover, .np-queue-btn:hover, .np-expand:hover { color: #00ff88; }
.np-close:hover { color: #fff; }

/* VIDEO PLAYER MODAL */
.video-modal {
  display: none;
  position: fixed; top: 0; left: 0;
  width: 100%; height: 100%;
  background: #000; z-index: 200;
  flex-direction: column;
}
.video-modal.active { display: flex; }

.video-modal-header {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px; background: rgba(0,0,0,0.8);
  flex-shrink: 0;
}
.video-modal-header button {
  background: none; border: none; color: #fff;
  font-size: 22px; cursor: pointer; padding: 4px;
}

/* Song/Video Toggle */
.mode-toggle {
  display: flex; background: #222; border-radius: 25px;
  padding: 3px; gap: 2px; margin: 0 auto;
}
.mode-toggle button {
  padding: 6px 18px; border-radius: 22px; border: none;
  background: none; color: #888; font-size: 13px;
  cursor: pointer; font-weight: bold; transition: all 0.2s;
}
.mode-toggle button.active {
  background: #fff; color: #000;
}

.video-modal-more {
  background: none; border: none; color: #fff;
  font-size: 22px; cursor: pointer; padding: 4px;
  margin-left: auto;
}

/* Video area */
.video-area {
  flex: 1; display: flex; align-items: center;
  justify-content: center; background: #000;
  position: relative; overflow: hidden;
}
.video-area #videoPlayer {
  width: 100%; height: 100%;
}
.video-area .song-thumb {
  width: 200px; height: 200px; border-radius: 16px;
  object-fit: cover; box-shadow: 0 8px 40px rgba(0,255,136,0.2);
}

/* Song info in modal */
.video-modal-info {
  padding: 20px 20px 10px;
  background: #000; flex-shrink: 0;
}
.video-modal-info h2 {
  font-size: 20px; font-weight: 800; color: #fff;
  margin-bottom: 4px;
}
.video-modal-info p { font-size: 14px; color: #888; }

/* Progress bar */
.progress-wrap {
  padding: 0 20px; background: #000; flex-shrink: 0;
}
.progress-bar {
  width: 100%; height: 4px; background: #333;
  border-radius: 2px; margin: 12px 0 6px;
  cursor: pointer; position: relative;
}
.progress-fill {
  height: 100%; background: #00ff88;
  border-radius: 2px; width: 0%;
  transition: width 0.5s linear;
}
.progress-times {
  display: flex; justify-content: space-between;
  font-size: 11px; color: #555;
}

/* Modal Controls */
.video-modal-controls {
  display: flex; align-items: center; justify-content: center;
  gap: 24px; padding: 16px 20px;
  background: #000; flex-shrink: 0;
}
.video-modal-controls button {
  background: none; border: none; color: #fff;
  cursor: pointer; transition: all 0.2s;
}
.video-modal-controls .ctrl-side { font-size: 26px; color: #aaa; }
.video-modal-controls .ctrl-side:hover { color: #fff; }
.video-modal-controls .ctrl-main {
  width: 64px; height: 64px; border-radius: 50%;
  background: #fff; color: #000; font-size: 28px;
  display: flex; align-items: center; justify-content: center;
}
.video-modal-controls .ctrl-main:hover { background: #00ff88; }

/* Tabs */
.video-modal-tabs {
  display: flex; background: #000;
  border-top: 1px solid #1a1a1a; flex-shrink: 0;
}
.video-modal-tabs button {
  flex: 1; padding: 14px; background: none; border: none;
  color: #555; font-size: 12px; font-weight: bold;
  cursor: pointer; text-transform: uppercase;
  letter-spacing: 1px; transition: all 0.2s;
  border-bottom: 2px solid transparent;
}
.video-modal-tabs button.active {
  color: #fff; border-bottom-color: #00ff88;
}

/* Queue Panel */
.queue-panel {
  position: fixed; bottom: 55px; right: 0;
  width: 300px; max-height: 400px;
  background: #111; border: 1px solid #1e1e1e;
  border-radius: 16px 0 0 0; z-index: 100;
  flex-direction: column; overflow: hidden;
  box-shadow: -4px -4px 20px rgba(0,0,0,0.5);
  display: none;
}
.queue-panel.active { display: flex; }
.queue-header {
  display: flex; justify-content: space-between;
  align-items: center; padding: 14px 16px;
  background: #161616; border-bottom: 1px solid #1e1e1e;
  font-size: 13px; font-weight: bold; color: #fff; flex-shrink: 0;
}
.queue-header button { background: none; border: none; color: #666; font-size: 16px; cursor: pointer; }
.queue-header button:hover { color: #fff; }
.queue-list { overflow-y: auto; padding: 8px; }
.queue-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: 10px;
  cursor: pointer; transition: all 0.2s;
  font-size: 12px; color: #ccc;
}
.queue-item:hover { background: #1a1a1a; color: #fff; }
.queue-item.active { color: #00ff88; background: #0a1a12; }
.queue-item .qi-num { color: #444; min-width: 20px; font-size: 11px; }
.queue-item .qi-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

@media (max-width: 768px) {
  body { height: 100dvh; }
  .main { flex-direction: column; }
  .search-panel { flex: 1; overflow-y: auto; order: 1; min-height: 0; }
  .ai-panel {
    width: 100%; min-width: unset; height: 44vh; flex-shrink: 0;
    border-left: none; border-top: 1px solid #1e1e1e; order: 2;
  }
  .grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
  header h1 { font-size: 14px; }
  header input { font-size: 12px; padding: 7px 12px; }
  header .search-btn { font-size: 12px; padding: 7px 12px; }
  header .wrapped-btn { font-size: 11px; padding: 7px 10px; }
  .queue-panel { width: 100%; border-radius: 16px 16px 0 0; }
  .np-controls button, .np-queue-btn, .np-close { font-size: 16px; padding: 4px 6px; }
  .video-area .song-thumb { width: 160px; height: 160px; }
}

header, .main, .now-playing { position: relative; z-index: 1; }
.queue-panel { position: fixed; z-index: 100; }
#player { display: none; }
</style>
</head>
<body>

<!-- Instagram browser detection -->

    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#0a0a0f;color:#fff;text-align:center;padding:30px;gap:20px;">
      <div style="font-size:48px">⚡</div>
      <h2 style="color:#00ff88;font-size:22px">StreamFlow</h2>

    </div>`;
}
</script>

<canvas id="bgCanvas" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;"></canvas>

<header>
  <h1>⚡ StreamFlow</h1>
  <input id="searchInput" placeholder="Search songs, artists..." onkeydown="if(event.key==='Enter') searchYT()">

</header>

    <div class="grid" id="results"></div>
  </div>
  <div class="ai-panel">

      <div class="dot"></div>
      <span class="name">VibeBot</span>

    </div>
    <div class="ai-messages" id="aiMessages">
      <div class="ai-msg bot">Hey! 👋 Tell me your mood and I'll find the perfect songs for you.</div>
    </div>

      <input id="aiInput" placeholder="How are you feeling..." onkeydown="if(event.key==='Enter') sendMsg()">

  </div>
</div>

<!-- Now Playing Bar -->
<div class="now-playing" id="nowPlaying" onclick="openVideoModal()">
  <span class="np-icon" id="npIcon">♫</span>
  <img class="np-thumb" id="npThumb" src="">
  <div class="np-info">
    <div class="np-title" id="npTitle">—</div>
    <div class="np-sub">Now Playing • tap to expand</div>
  </div>
  <div class="np-controls" onclick="event.stopPropagation()">
    <button onclick="playPrev()" title="Previous">⏮</button>
    <button id="playPauseBtn" onclick="togglePlayPause()" title="Play/Pause">⏸</button>

  <button class="np-queue-btn" onclick="event.stopPropagation(); toggleQueue()" title="Up Next">☰</button>
  <button class="np-close" onclick="event.stopPropagation(); stopPlayer()">✕</button>
</div>

<!-- Video Modal -->
<div class="video-modal" id="videoModal">
  <div class="video-modal-header">
    <button onclick="closeVideoModal()">⌄</button>
    <div class="mode-toggle">
      <button id="songModeBtn" class="active" onclick="setMode('song')">Song</button>
      <button id="videoModeBtn" onclick="setMode('video')">Video</button>

    <button class="video-modal-more">⋯</button>

  <!-- Media Area -->
  <div class="video-area" id="videoArea">
    <img class="song-thumb" id="modalThumb" src="" style="display:block;">
    <div id="videoPlayer" style="display:none;"></div>
  </div>

  <!-- Song Info -->
  <div class="video-modal-info">

  </div>

      <div class="progress-fill" id="progressFill"></div>
    </div>

      <span id="currentTime">0:00</span>
      <span id="totalTime">0:00</span>
    </div>

  <!-- Controls -->
  <div class="video-modal-controls">
    <button class="ctrl-side" onclick="playPrev()">⏮</button>
    <button class="ctrl-main" id="modalPlayPauseBtn" onclick="togglePlayPause()">⏸</button>
    <button class="ctrl-side" onclick="playNext()">⏭</button>
  </div>

  <!-- Tabs -->
  <div class="video-modal-tabs">

    <button onclick="switchTab(this, 'related')">Related</button>

  <!-- Tab Content -->
  <div id="tabUpnext" style="flex:1;overflow-y:auto;padding:8px;background:#000;">
    <div id="modalQueueList"></div>
  </div>

  </div>
</div>

<!-- Queue Panel -->

  <div class="queue-header">
    <span>Up Next</span>
    <button onclick="toggleQueue()">✕</button>
  </div>
  <div class="queue-list" id="queueList"></div>
</div>

<div id="player"></div>

<script src="script.js"></script>

<script>
let chatHistory = JSON.parse(localStorage.getItem("chatHistory")) || [];
let currentMode = 'song';
let currentVideoId = '';
let currentArtist = '';
let currentThumb = '';
let progressInterval = null;
let videoPlayerReady = false;
let videoPlayer = null;

// Video Player Init
function initVideoPlayer(videoId) {
  if (videoPlayer) {
    videoPlayer.loadVideoById(videoId);
    return;
  }
  videoPlayer = new YT.Player('videoPlayer', {
    height: '100%', width: '100%',
    videoId: videoId,
    playerVars: { autoplay: 1, controls: 0, rel: 0 },
    events: {
      onReady: () => { videoPlayerReady = true; },
      onStateChange: (e) => {
        if (e.data === YT.PlayerState.PLAYING) {
          document.getElementById("modalPlayPauseBtn").innerText = "⏸";
          startProgress();
        } else if (e.data === YT.PlayerState.PAUSED) {
          document.getElementById("modalPlayPauseBtn").innerText = "▶";
        }
      }
    }
  });
}

function setMode(mode) {
  currentMode = mode;
  document.getElementById('songModeBtn').classList.toggle('active', mode === 'song');
  document.getElementById('videoModeBtn').classList.toggle('active', mode === 'video');

  const thumb = document.getElementById('modalThumb');
  const vp = document.getElementById('videoPlayer');

  if (mode === 'video') {
    thumb.style.display = 'none';
    vp.style.display = 'block';
    if (currentVideoId) initVideoPlayer(currentVideoId);
  } else {
    thumb.style.display = 'block';
    vp.style.display = 'none';
    if (videoPlayer) videoPlayer.pauseVideo();
  }
}

function openVideoModal() {
  document.getElementById('videoModal').classList.add('active');
  updateModalQueueUI();
  startProgress();
}

function closeVideoModal() {
  document.getElementById('videoModal').classList.remove('active');
}

function startProgress() {
  clearInterval(progressInterval);
  progressInterval = setInterval(() => {
    if (!player) return;
    try {
      const current = player.getCurrentTime();
      const total = player.getDuration();
      if (total > 0) {
        document.getElementById('progressFill').style.width = (current/total*100) + '%';
        document.getElementById('currentTime').innerText = formatTime(current);
        document.getElementById('totalTime').innerText = formatTime(total);
      }
    } catch(e) {}
  }, 500);
}

function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m}:${s.toString().padStart(2,'0')}`;
}

function seekTo(e) {
  const bar = e.currentTarget;
  const pct = e.offsetX / bar.offsetWidth;
  if (player) player.seekTo(player.getDuration() * pct, true);
}

function switchTab(btn, tab) {
  document.querySelectorAll('.video-modal-tabs button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tabUpnext').style.display = tab === 'upnext' ? 'block' : 'none';
  document.getElementById('tabRelated').style.display = tab === 'related' ? 'block' : 'none';
}

function updateModalQueueUI() {
  const list = document.getElementById('modalQueueList');
  if (currentQueue.length === 0) {
    list.innerHTML = `<p style="color:#444;font-size:12px;padding:12px">Queue empty!</p>`;
    return;
  }
  list.innerHTML = currentQueue.map((item, i) => `
    <div class="queue-item ${i === currentQueueIndex ? 'active' : ''}" onclick="jumpToQueue(${i}); updateModalQueueUI();">
      <span class="qi-num">${i === currentQueueIndex ? '▶' : i+1}</span>
      <span class="qi-title">${item.title}</span>
    </div>
  `).join("");
}

// Override playSong to update modal info
const _origPlaySong = playSong;
window.playSong = function(videoId, title, artist, queue, thumb) {
  currentVideoId = videoId;
  currentArtist = artist;
  currentThumb = thumb || `https://img.youtube.com/vi/${videoId}/mqdefault.jpg`;

  _origPlaySong(videoId, title, artist, queue);

  // Update bar
  document.getElementById('npTitle').innerText = title;
  document.getElementById('npThumb').src = currentThumb;
  document.getElementById('npThumb').classList.add('show');
  document.getElementById('npIcon').style.display = 'none';
  document.getElementById('playPauseBtn').innerText = '⏸';

  // Update modal
  document.getElementById('modalTitle').innerText = title;
  document.getElementById('modalArtist').innerText = artist;
  document.getElementById('modalThumb').src = currentThumb;
  document.getElementById('modalPlayPauseBtn').innerText = '⏸';

  if (currentMode === 'video' && document.getElementById('videoModal').classList.contains('active')) {
    initVideoPlayer(videoId);
  }

  startProgress();
};

function cleanText(text) {
  return text.replace(/\*\
