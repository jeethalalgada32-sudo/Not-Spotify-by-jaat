<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamFlow AI ⚡</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- SIDEBAR -->
<div id="sidebar" class="sidebar">
    <h2>StreamFlow</h2>
    <a href="#" onclick="closeSidebar()">🏠 Home</a>
    <a href="#" onclick="generateWrapped(); closeSidebar()">🎧 My Wrapped</a>
    <a href="#" onclick="clearHistory(); closeSidebar()">🗑️ Clear History</a>
</div>

<!-- HEADER -->
<header>
    <button id="menuBtn">☰</button>
    <input id="searchInput" placeholder="Search songs, artists..." type="text">
    <button onclick="searchYT()">Search</button>
</header>

<!-- MAIN CONTENT -->
<div id="results" class="grid"></div>

<!-- VIDEO PLAYER OVERLAY -->
<div id="videoOverlay" class="overlay">
    <button id="closeBtn">✖</button>
    <div id="player"></div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script src="script.js"></script>

</body>
</html>
