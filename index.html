<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamFlow Music | AI Matrix 🎵</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/body-pix"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.3.0/color-thief.umd.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="sidebar" class="sidebar">
        <h2 class="sidebar-logo">Menu</h2>
        <a href="#" data-page="home">🏠 Home</a>
        <a href="#" data-page="library">📚 My Library</a>
    </div>

    <header class="glass-header">
        <div class="logo"><span id="menuBtn">☰</span> StreamFlow⚡</div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search your vibe...">
            <button class="search-btn" onclick="searchYT()">🔍</button>
        </div>
    </header>

    <main id="home" class="page active">
        <div id="results" class="cards">
            <p class="placeholder-text">Search for a song to see the AI magic! 🎧</p>
        </div>
    </main>

    <div id="videoOverlay" class="player-overlay">
        <div class="overlay-controls">
            <button id="matrixToggle" class="mode-btn">AI Matrix: OFF</button>
            <button id="closeBtn" class="close-btn">✖ Close</button>
        </div>
        <div class="player-wrapper">
            <canvas id="matrixCanvas"></canvas>
            <div id="player"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
