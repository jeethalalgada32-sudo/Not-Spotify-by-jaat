<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StreamFlow ⚡</title>
<link rel="stylesheet" href="style.css">
<style>
/* LAYOUT */
body { display: flex; flex-direction: column; height: 100vh; margin: 0; background: #0a0a0f; color: #fff; font-family: 'Segoe UI', sans-serif; }

header {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 16px; background: #111;
  border-bottom: 1px solid #1e1e1e; z-index: 10;
}
header h1 { font-size: 18px; color: #00ff88; margin-right: auto; white-space: nowrap; }
header input {
  flex: 1; padding: 9px 16px; border-radius: 25px;
  border: 1px solid #333; background: #1a1a1a;
  color: #fff; font-size: 14px; outline: none; max-width: 400px;
}
header input:focus { border-color: #00ff88; }
header button {
  padding: 9px 18px; border-radius: 25px; border: none;
  background: #00ff88; color: #000; font-weight: bold;
  cursor: pointer; font-size: 14px; white-space: nowrap;
}

.main { display: flex; flex: 1; overflow: hidden; }

/* SEARCH RESULTS */
.search-panel {
  flex: 1; overflow-y: auto; padding: 16px;
  display: flex; flex-direction: column; gap: 10px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 12px;
}

.card {
  background: #111; border-radius: 12px;
  border: 1px solid #1e1e1e; cursor: pointer;
  overflow: hidden; transition: all 0.2s;
}
.card:hover { border-color: #00ff88; transform: translateY(-2px); }
.card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; }
.card p { font-size: 12px; color: #ccc; padding: 8px; line-height: 1.4; }

/* AI PANEL */
.ai-panel {
  width: 340px; border-left: 1px solid #1e1e1e;
  display: flex; flex-direction: column; background: #0d0d14;
}
.ai-header {
  padding: 14px 16px; background: #111;
  border-bottom: 1px solid #1e1e1e;
  display: flex; align-items: center; gap: 8px;
}
.ai-header .dot { width: 8px; height: 8px; border-radius: 50%; background: #00ff88; }
.ai-header span { font-size: 14px; font-weight: bold; color: #00ff88; }
.ai-header small { color: #555; font-size: 11px; margin-left: auto; }

.ai-messages {
  flex: 1; overflow-y: auto; padding: 14px;
  display: flex; flex-direction: column; gap: 10px;
}
.ai-msg {
  padding: 10px 13px; border-radius: 14px;
  font-size: 13px; line-height: 1.6; max-width: 92%;
}
.ai-msg.bot {
  background: #13131f; border: 1px solid #222;
  align-self: flex-start; border-bottom-left-radius: 4px;
}
.ai-msg.user {
  background: #00ff88; color: #000;
  align-self: flex-end; border-bottom-right-radius: 4px;
}

.song-chip {
  display: flex; align-items: center; gap: 8px;
  background: #1a1a2e; border: 1px solid #2a2a4a;
  border-radius: 10px; padding: 7px 11px;
  margin-top: 5px; cursor: pointer; font-size: 12px;
  transition: all 0.2s;
}
.song-chip:hover { border-color: #00ff88; color: #00ff88; }
.song-chip .play-icon { font-size: 16px; }

.ai-input {
  display: flex; gap: 8px; padding: 12px;
  background: #111; border-top: 1px solid #1e1e1e;
}
.ai-input input {
  flex: 1; padding: 9px 14px; border-radius: 25px;
  border: 1px solid #333; background: #1a1a1a;
  color: #fff; font-size: 13px; outline: none;
}
.ai-input input:focus { border-color: #00ff88; }
.ai-input button {
  padding: 9px 16px; border-radius: 25px; border: none;
  background: #00ff88; color: #000; font-weight: bold;
  cursor: pointer; font-size: 13px;
}
.ai-input button:disabled { background: #222; color: #555; cursor: not-allowed; }

/* NOW PLAYING BAR */
.now-playing {
  display: none; align-items: center; gap: 12px;
  padding: 10px 16px; background: #111;
  border-top: 1px solid #1e1e1e;
}
.now-playing.active { display: flex; }
.now-playing .track-info { flex: 1; }
.now-playing .track-info .title { font-size: 13px; color: #fff; }
.now-playing .track-info .sub { font-size: 11px; color: #555; }
.now-playing button {
  background: none; border: none; color: #666;
  font-size: 18px; cursor: pointer; padding: 4px 8px;
}
.now-playing button:hover { color: #fff; }

/* NAV */
.nav-links {
  display: flex; gap: 6px; align-items: center;
}
.nav-links a {
  color: #666; text-decoration: none; font-size: 13px;
  padding: 7px 14px; border-radius: 20px;
  border: 1px solid #222; transition: all 0.2s;
}
.nav-links a:hover { color: #fff; border-color: #444; }

#player { display: none; }
</style>
</head>
<body>

<header>
  <h1>⚡ StreamFlow</h1>
  <input id="searchInput" placeholder="Search songs, artists..." onkeydown="if(event.key==='Enter') searchYT()">
  <button onclick="searchYT()">Search</button>
  <div class="nav-links">
    <a href="wrapped.html">Wrapped</a>
  </div>
</header>

<div class="main">

  <!-- Search Results -->
  <div class="search-panel">
    <div class="grid" id="results">
      <p style="color:#333; font-size:14px; grid-column:1/-1; padding: 20px 0;">Search for songs or ask VibeBot 👉</p>
    </div>
  </div>

  <!-- AI Panel -->
  <div class="ai-panel">
    <div class="ai-header">
      <div class="dot"></div>
      <span>VibeBot</span>
      <small>AI Music Assistant</small>
    </div>
    <div class="ai-messages" id="aiMessages">
      <div class="ai-msg bot">Hey! 👋 Tell me your mood and I'll find the perfect songs for you.</div>
    </div>
    <div class="ai-input">
      <input id="aiInput" placeholder="How are you feeling..." onkeydown="if(event.key==='Enter') sendMsg()">
      <button id="sendBtn" onclick="sendMsg()">→</button>
    </div>
  </div>

</div>

<!-- Now Playing -->
<div class="now-playing" id="nowPlaying">
  <span style="color:#00ff88; font-size:20px;">♫</span>
  <div class="track-info">
    <div class="title" id="npTitle">—</div>
    <div class="sub">Now Playing</div>
  </div>
  <button onclick="stopPlayer()">✕</button>
</div>

<div id="player"></div>

<script src="script.js"></script>
<script>
let chatHistory = JSON.parse(localStorage.getItem("chatHistory")) || [];

function addAiMsg(text, type) {
  const container = document.getElementById("aiMessages");
  const div = document.createElement("div");
  div.className = "ai-msg " + type;

  if (type === "bot") {
    const lines = text.split("\n");
    let html = "";
    lines.forEach(line => {
      const trimmed = line.trim();
      if (trimmed.startsWith("🎵")) {
        const songName = trimmed.replace("🎵", "").trim();
        html += `<div class="song-chip" onclick="playSongByName('${songName.replace(/'/g,"\\'")}')">
          <span class="play-icon">▶</span>
          <span>${songName}</span>
        </div>`;
      } else if (trimmed) {
        html += `<p style="margin:2px 0;color:#aaa;">${trimmed}</p>`;
      }
    });
    div.innerHTML = html;
  } else {
    div.innerText = text;
  }

  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

async function sendMsg() {
  const input = document.getElementById("aiInput");
  const btn = document.getElementById("sendBtn");
  const text = input.value.trim();
  if (!text) return;

  addAiMsg(text, "user");
  input.value = "";
  btn.disabled = true;

  chatHistory.push({ role: "user", content: text });

  // Typing
  const container = document.getElementById("aiMessages");
  const typing = document.createElement("div");
  typing.className = "ai-msg bot";
  typing.style.color = "#444";
  typing.innerText = "Finding your vibe...";
  container.appendChild(typing);
  container.scrollTop = container.scrollHeight;

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, history: chatHistory.slice(-8) })
    });
    const data = await res.json();
    typing.remove();
    addAiMsg(data.reply, "bot");
    chatHistory.push({ role: "assistant", content: data.reply });
    localStorage.setItem("chatHistory", JSON.stringify(chatHistory.slice(-20)));
  } catch (e) {
    typing.remove();
    addAiMsg("Something went wrong. Try again!", "bot");
  }

  btn.disabled = false;
  input.focus();
}

// Play song by name via YouTube search
async function playSongByName(name) {
  const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(name)}&type=video&maxResults=1&key=${YOUTUBE_API_KEY}`);
  const data = await res.json();
  if (data.items && data.items.length > 0) {
    const item = data.items[0];
    player.loadVideoById(item.id.videoId);
    document.getElementById("npTitle").innerText = item.snippet.title;
    document.getElementById("nowPlaying").classList.add("active");
    history.push({ title: item.snippet.title, artist: item.snippet.channelTitle, time: Date.now() });
    localStorage.setItem("history", JSON.stringify(history));
  }
}

function stopPlayer() {
  if (player && player.stopVideo) player.stopVideo();
  document.getElementById("nowPlaying").classList.remove("active");
}
</script>

</body>
    </html>
