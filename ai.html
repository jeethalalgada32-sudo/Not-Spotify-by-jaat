    <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VibeBot 🎧</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    background: #000;
    color: white;
    font-family: sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
}

.chat {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.msg {
    padding: 12px 16px;
    border-radius: 18px;
    max-width: 75%;
    line-height: 1.5;
    white-space: pre-wrap;
}

.user {
    background: #00ff88;
    color: black;
    margin-left: auto;
    border-bottom-right-radius: 4px;
}

.bot {
    background: #1a1a2e;
    border: 1px solid #333;
    border-bottom-left-radius: 4px;
}

.inputBox {
    display: flex;
    padding: 12px;
    background: #111;
    gap: 8px;
    border-top: 1px solid #222;
}

input {
    flex: 1;
    padding: 12px;
    border-radius: 25px;
    border: 1px solid #333;
    background: #1a1a1a;
    color: white;
    font-size: 15px;
    outline: none;
}

button {
    padding: 12px 20px;
    border-radius: 25px;
    border: none;
    background: #00ff88;
    color: black;
    font-weight: bold;
    cursor: pointer;
    font-size: 15px;
}

button:disabled {
    background: #444;
    color: #888;
    cursor: not-allowed;
}

.typing {
    color: #666;
    font-style: italic;
    padding: 8px 16px;
}
</style>
</head>

<body>

<div class="chat" id="chat"></div>

<div class="inputBox">
    <input id="userInput" placeholder="Apna vibe batao... 🎵" onkeydown="if(event.key==='Enter') sendMsg()">
    <button id="sendBtn" onclick="sendMsg()">Send 🎧</button>
</div>

<script>
// Conversation history — proper format
let history = JSON.parse(localStorage.getItem("vibebot_history")) || [];

function addMsg(text, type) {
    const chat = document.getElementById("chat");
    const div = document.createElement("div");
    div.className = "msg " + type;
    div.innerText = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
}

async function sendMsg() {
    const input = document.getElementById("userInput");
    const btn = document.getElementById("sendBtn");
    const text = input.value.trim();
    if (!text) return;

    // Show user message
    addMsg(text, "user");
    input.value = "";
    btn.disabled = true;

    // Save user message to history
    history.push({ role: "user", content: text });

    // Show typing indicator
    const chat = document.getElementById("chat");
    const typing = document.createElement("div");
    typing.className = "typing";
    typing.innerText = "VibeBot soch raha hai... 🎵";
    chat.appendChild(typing);
    chat.scrollTop = chat.scrollHeight;

    try {
        const res = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                message: text,
                history: history.slice(-10) // last 10 messages
            })
        });

        const data = await res.json();

        // Remove typing indicator
        typing.remove();

        // Show bot reply
        addMsg(data.reply, "bot");

        // Save bot reply to history
        history.push({ role: "assistant", content: data.reply });

        // Save to localStorage
        localStorage.setItem("vibebot_history", JSON.stringify(history.slice(-20)));

    } catch (e) {
        typing.remove();
        addMsg("Server error ho gaya 😢 Dobara try kar!", "bot");
    }

    btn.disabled = false;
    input.focus();
}
</script>

</body>
</html>
